name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l *.go)"
      - run: go mod verify
      - run: go test -race -timeout 90s ./...
      - run: go vet ./...
      - run: go test -run='^$' -fuzz=FuzzMapACPLine -fuzztime=10s -parallel=2 .
      - run: go build -trimpath -o bin/ax-agentconnect .
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Linux cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o bin/ax-agentconnect-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o bin/ax-agentconnect-linux-arm64 .
